[package]
name = "math-server-mcp"
version = "0.1.0"
edition = "2024"
description = "Servidor MCP com ferramentas matemáticas em Rust — Guilda de IA S07"

[dependencies]
rmcp = { version = "0.1", features = ["server", "macros", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"